<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIドラム譜メーカー</title><style>body{font:16px system-ui;background:#eef1f5;color:#182337;margin:0}main{max-width:1050px;margin:auto;padding:18px}section{background:white;border-radius:12px;padding:18px;margin:12px 0}button,input,select{font:inherit;padding:8px;margin:4px;border:1px solid #b9c3cf;border-radius:6px}button{cursor:pointer;background:#e8effa}button.on{background:#2458a5;color:white}audio{width:100%}.scroll{overflow:auto}table{border-collapse:collapse}td,th{padding:2px;text-align:center}td button{width:32px;height:32px;padding:0;margin:1px}svg{width:100%;min-width:650px}label{display:inline-block} @media print{body{background:white} .controls,button,audio{display:none!important}section{padding:0}main{padding:0}svg{min-width:0}}</style><main><h1>AIドラム譜メーカー</h1><p>基本版 0.1 — 手動採譜</p><section class="controls"><input id="audioFile" type="file" accept="audio/*"><audio id="player" controls></audio><label>速度 <select id="speed"><option>.5</option><option>.75</option><option selected>1</option><option>1.25</option></select></label></section><section><label>曲名 <input id="song"></label><label>アーティスト <input id="artist"></label><label>BPM <input id="bpm" type="number" min="30" max="300" value="105"></label><p>4/4拍子・16分音符グリッド</p><div class="controls"><button id="prev">前の小節</button><button id="next">次の小節</button><button id="add">小節追加</button><button id="toggle">五線譜／タブ譜切替</button><button id="clear">この小節をクリア</button></div><h3 id="measure"></h3><div class="scroll controls" id="editor"></div><div class="scroll" id="score"></div></section><section class="controls"><button id="save">端末に保存</button><button id="load">保存データを開く</button><button id="export">JSON書き出し</button><input type="file" id="import" accept=".json"><button onclick="window.print()">印刷・PDF保存</button><p>音源は端末内で再生します。保存対象は楽譜データのみです。</p></section></main><script>
const $=id=>document.getElementById(id), names=['クラッシュ','ライド','ハイハット','ハイタム','スネア','ロータム','バスドラム'], ys=[25,35,45,55,65,75,85], blank=()=>names.map(()=>Array(16).fill(false));let bars=[blank()],idx=0,staff=true,url;
function render(){ $('measure').textContent=`第 ${idx+1} / ${bars.length} 小節`;let h='<table><tr><th>楽器</th>'+Array.from({length:16},(_,i)=>`<th>${['1','e','&','a','2','e','&','a','3','e','&','a','4','e','&','a'][i]}</th>`).join('')+'</tr>';names.forEach((n,r)=>{h+=`<tr><th>${n}</th>`+bars[idx][r].map((v,c)=>`<td><button aria-label="${n} ${c+1}" class="${v?'on':''}" onclick="hit(${r},${c})">${v?'●':'·'}</button></td>`).join('')+'</tr>'});$('editor').innerHTML=h+'</table>';if(!staff){$('score').innerHTML=bars.map((b,i)=>`<h4>第${i+1}小節</h4><pre>${b.map((r,j)=>['CC','RD','HH','HT','SD','LT','BD'][j]+' | '+r.map(v=>v?'x':'-').join(' ')).join('\n')}</pre>`).join('');return} $('score').innerHTML=bars.map((b,i)=>{let s=`<svg viewBox="0 0 760 145" role="img" aria-label="第${i+1}小節"><text x="10" y="16" font-size="12">${i+1}</text>`;for(let y=45;y<=85;y+=10)s+=`<path d="M40 ${y}H745" stroke="black"/>`;s+='<path d="M40 45V85 M745 45V85" stroke="black"/><text x="49" y="63" font-size="17">4</text><text x="49" y="81" font-size="17">4</text>';for(let c=0;c<16;c++){let x=90+c*41;let active=b.map((r,j)=>r[c]?j:-1).filter(j=>j>=0);for(let j of active){let y=ys[j];s+=j<3?`<path d="M${x-4} ${y-4}l8 8m-8 0l8 -8" stroke="black" stroke-width="2"/>`:`<ellipse cx="${x}" cy="${y}" rx="5" ry="3.5" fill="black"/>`; }if(active.length){let y=Math.max(...active.map(j=>ys[j]));let top=Math.min(...active.map(j=>ys[j]))-24;s+=`<path d="M${x+5} ${y}V${top}q12 6 8 13 M${x+5} ${top+7}q12 6 8 13" stroke="black" fill="none"/>`}s+=`<text x="${x}" y="126" font-size="11" text-anchor="middle">${c%4===0?c/4+1:['','e','&','a'][c%4]}</text>`}return s+'</svg>'}).join('')}
function hit(r,c){bars[idx][r][c]=!bars[idx][r][c];render()}$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};$('next').onclick=()=>{idx=Math.min(bars.length-1,idx+1);render()};$('add').onclick=()=>{bars.push(blank());idx=bars.length-1;render()};$('clear').onclick=()=>{if(confirm('この小節をクリアしますか？')){bars[idx]=blank();render()}};$('toggle').onclick=()=>{staff=!staff;render()};$('audioFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);$('player').src=url;if(!$('song').value)$('song').value=f.name.replace(/\.[^.]+$/,'')};$('speed').onchange=()=>{$('player').playbackRate=Number($('speed').value)};function data(){return {song:$('song').value,artist:$('artist').value,bpm:Number($('bpm').value),bars}}function restore(d){if(!Array.isArray(d.bars)||!d.bars.length||!d.bars.every(b=>Array.isArray(b)&&b.length===7&&b.every(r=>Array.isArray(r)&&r.length===16&&r.every(v=>typeof v==='boolean'))))throw Error('楽譜形式が違います');bars=d.bars;idx=0;for(let k of ['song','artist','bpm'])$(k).value=d[k]??'';render()}$('save').onclick=()=>{try{localStorage.setItem('drum-score-v1',JSON.stringify(data()));alert('保存しました')}catch(e){alert(e.message)}};$('load').onclick=()=>{try{let d=localStorage.getItem('drum-score-v1');if(!d)return alert('保存データがありません');restore(JSON.parse(d))}catch(e){alert(e.message)}};$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data())],{type:'application/json'}));a.href=u;a.download='drum-score.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async e=>{try{if(e.target.files[0])restore(JSON.parse(await e.target.files[0].text()))}catch(e){alert(e.message)}};render();</script></html>
